packages:
  - "packages/*"
  - "examples/*"
  - "deploy/docker/project"

# Allow esbuild (tsup + vitest) and sharp (Next image optimization) to run
# their install scripts (pnpm 11 model).
allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain guard: dependency versions must be at least 3 days old (4320 minutes).
# A handful of trusted, frequently-released dev tools are exempted below.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - turbo
  - "@turbo/*"
  - expect-type
  # TypeScript 7 (native Go port) + platform binaries — Microsoft-published toolchain;
  # we pin the major and want latest patches without waiting out the 3-day gate.
  - typescript
  - "@typescript/*"
  # Fumadocs Astro adapter shipped in 16.11.2 (2 days before adoption) — the docs
  # site needs it now; fuma-nama's packages, pinned by ^16.11.3 in docs-site.
  - fumadocs-core
  - fumadocs-ui
  - "@fumadocs/*"
