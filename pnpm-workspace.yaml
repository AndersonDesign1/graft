packages:
  - "packages/*"
  # Real Next.js 15 and 16 apps that run @usegraft/sdk-next (see its compat/).
  - "packages/sdk-next/compat/*"
  - "examples/*"
  - "deploy/docker/project"

# Transitive pins their parents will not move. Each line is a leftover
# Dependabot row: browserslist 4.28.5 (two advisories, patched in 4.28.7+),
# path-to-regexp 6.1.0 under @vercel/routing-utils, launch-editor under Vite 5,
# and old esbuild copies under drizzle-kit / vitest / tsup, tinypool 2.1.0
# pinned exactly by oxfmt (two advisories, patched in 2.1.2), and fflate 0.7.3
# pinned exactly by satori (patched in 0.7.5).
#
# The October 2026 audit rows: postcss 8.4.31 pinned exactly by next 15 (four
# advisories, patched in 8.5.23+), dompurify under @milkdown (patched in
# 3.4.17), katex 0.16 under micromark-extension-math (patched in 0.18.2;
# @milkdown/crepe already runs 0.18), zod 4.1 under @vercel/cli-config and
# 4.5 under better-auth (patched in 4.6.6), undici under unifont (patched in 8.12.2), fast-uri under
# ajv (patched in 3.1.9) and body-parser under the MCP SDK's Express server
# (patched in 2.4.0; Graft serves MCP over the web-standard transport, not
# Express).
overrides:
  browserslist: 4.28.8
  path-to-regexp@6.1.0: 6.3.0
  launch-editor: 2.14.1
  esbuild@0.18.20: 0.28.2
  esbuild@0.21.5: 0.28.2
  esbuild@0.25.12: 0.28.2
  esbuild@0.27.7: 0.28.2
  tinypool@2.1.0: 2.1.2
  fflate@0.7.3: 0.7.5
  postcss@8.4.31: 8.5.31
  dompurify: 3.4.17
  katex@0.16.47: 0.18.10
  zod@4.1.11: 4.6.7
  zod@4.5.4: 4.6.7
  undici@8.11.2: 8.12.3
  fast-uri: 3.1.9
  body-parser: 2.4.0

# better-auth lists vitest as an optional peer (^2 || ^3 || ^4) for its test
# helpers. The root's vitest 5 is outside that range, so pnpm installed a
# separate vitest 3.2.7 for the landing page, which pulled in vite 5 and five
# Dependabot alerts. Accepting vitest 5 for that one peer links the root's copy
# instead. Nothing in the repo imports better-auth's test helpers, so the
# unsupported pairing is never exercised.
peerDependencyRules:
  allowedVersions:
    better-auth>vitest: "5"

# Allow esbuild (tsup + vitest) and sharp (Next image optimization) to run
# their install scripts (pnpm 12 model).
allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain guard: dependency versions must be at least 3 days old (4320 minutes).
# A handful of trusted, frequently-released dev tools are exempted below.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - turbo
  - "@turbo/*"
  - expect-type
  # TypeScript 7 (native Go port) + platform binaries — Microsoft-published toolchain;
  # we pin the major and want latest patches without waiting out the 3-day gate.
  - typescript
  - "@typescript/*"
  # Fumadocs Astro adapter shipped in 16.11.2 (2 days before adoption) — the docs
  # site needs it now; fuma-nama's packages, pinned by ^16.11.3 in docs-site.
  - fumadocs-core
  - fumadocs-ui
  - "@fumadocs/*"
