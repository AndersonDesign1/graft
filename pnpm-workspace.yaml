packages:
  - "packages/*"
  - "examples/*"

# Allow esbuild (used by tsup + vitest) to run its install script (pnpm 11 model).
allowBuilds:
  esbuild: true

# Supply-chain guard: dependency versions must be at least 3 days old (4320 minutes).
# A handful of trusted, frequently-released dev tools are exempted below.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - turbo
  - "@turbo/*"
  - expect-type
