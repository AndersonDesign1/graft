# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews pull requests into main, the only long-lived branch and
# the default one.
#
# ⚠️ This alone does not turn reviews on. CodeRabbit's next message on #18 named
# a second gate: "This repository does not receive automatic reviews because it
# has fewer than 10 stars." So the base-branch default was one of two reasons
# and the star count is the binding one. This config is correct and inert until
# that changes — which is worth knowing before wondering why nothing reviews.
# Greptile has no such threshold and is doing the actual reviewing today.
language: en-GB

reviews:
  # The repo already runs Greptile and cubic, and both have found real defects
  # (a CSRF origin check in d376487, four findings on the approval-policy PR).
  # A fourth voice earns its place by being specific, so: no praise, and a
  # walkthrough only where the change is big enough to need one.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  path_filters:
    # Generated or vendored: reviewing these produces noise about code nobody
    # wrote by hand and nobody will edit by hand.
    - "!**/CHANGELOG.md"
    - "!pnpm-lock.yaml"
    - "!tools/oxlint/anti-slop/**"
    - "!examples/docs-site/.graft/**"
