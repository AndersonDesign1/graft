services:
  postgres:
    image: postgres:18
    container_name: graft-postgres
    environment:
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: graft
      POSTGRES_DB: graft
    ports:
      - "5432:5432"
    volumes:
      - graft_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft -d graft"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Same digest-pinned release as deploy/docker/Dockerfile (see its MinIO
    # comment): dev must run the same storage bytes as the self-host image.
    image: cgr.dev/chainguard/minio:latest@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    container_name: graft-minio
    # The image runs as uid 65532 and a fresh named volume is owned by root.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: graft
      MINIO_ROOT_PASSWORD: graftsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - graft_minio:/data

volumes:
  graft_pg:
  graft_minio:
