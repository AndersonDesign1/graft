openapi: 3.1.0
info:
  title: Graft Studio API
  version: 0.2.0
  description: |
    Opt-in Studio HTTP surface. The UI is only a client of this API.
    Every operation is also available via MCP and CLI (headless parity).
servers:
  - url: /
paths:
  /api/studio/v1/openapi.json:
    get:
      operationId: getOpenApi
      summary: OpenAPI document for this surface
      responses:
        "200":
          description: OpenAPI 3 document
  /api/studio/v1/tree:
    get:
      operationId: getContentTree
      summary: Content tree (disk merged with the compiled index)
      description: |
        Filesystem-first. Graft content is git-authoritative: the .mdx files on
        disk are truth and content_index is a projection refreshed by compile.
        Every on-disk document appears immediately, tagged by comparing its
        contentHash against the index:

          synced     on disk, in the index, hashes match
          drifted    in both, hashes differ — edited since the last compile
          unindexed  on disk only — never compiled
          orphaned   in the index only — the file is gone, the index is stale

        db-authoritative collections are returned with authority "db" and no
        documents; their rows live in data_records, reached through typed
        functions, and have no file to compare against.
      parameters:
        - name: branch
          in: query
          schema:
            type: string
            default: main
      responses:
        "200":
          description: Collections with per-document state and a drift summary
  /api/studio/v1/collections:
    get:
      operationId: listCollectionSchemas
      summary: Collection schemas (same shape as MCP describe_schema)
      responses:
        "200":
          description: Collections with their field descriptors
  /api/studio/v1/compile:
    post:
      operationId: compileBranch
      summary: Recompile a branch's content index (same as graft compile)
      description: |
        Refreshes content_index from disk for one branch. Exposed so the Studio
        can resolve the drift it reports instead of sending the operator to a
        terminal.
      parameters:
        - name: branch
          in: query
          schema:
            type: string
            default: main
      responses:
        "200":
          description: Added/changed/removed counts, doc count and git SHA
  /api/studio/v1/document:
    get:
      operationId: getDocument
      summary: Read one MDX document from disk (git truth)
      parameters:
        - name: collection
          in: query
          required: true
          schema:
            type: string
        - name: slug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document data, body, and raw source
    put:
      operationId: putDocument
      summary: Write MDX and recompile (parity with MCP write_content)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, slug, data]
              properties:
                collection:
                  type: string
                slug:
                  type: string
                data:
                  type: object
                  additionalProperties: true
                body:
                  type: string
                branch:
                  type: string
      responses:
        "200":
          description: Write + compile result
  /api/studio/v1/changes:
    get:
      operationId: getChanges
      summary: Uncommitted content changes (git status, scoped to the content directory)
      description: >-
        Content is git-authoritative, so this is the Studio's real answer to
        "what have I changed?" — no draft table involved. Returns tracked=false
        with a reason rather than failing when the project is not a git
        repository.
      responses:
        "200":
          description: Changed files + the git branch a commit would land on
  /api/studio/v1/changes/diff:
    get:
      operationId: getChangeDiff
      summary: Diff of one changed file against the last commit
      description: >-
        Parsed into hunks and numbered lines. A file git has never seen is
        returned as all-added; binary files return binary=true with no hunks.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hunks + added/removed counts
  /api/studio/v1/changes/commit:
    post:
      operationId: commitChanges
      summary: Commit selected content files (local only — never pushes)
      description: >-
        Commits the work-tree state of exactly the given paths, leaving anything
        else the operator had staged alone. Paths must appear in the current
        change set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths, message]
              properties:
                paths:
                  type: array
                  items:
                    type: string
                message:
                  type: string
      responses:
        "200":
          description: The new commit
        "409":
          description: >-
            GIT_UNAVAILABLE (not a work tree) or COMMIT_FAILED (no committer
            identity, or git refused)
  /api/studio/v1/compilations:
    get:
      operationId: listCompilations
      summary: Recent compilation trail rows
      parameters:
        - name: branch
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Compilation rows, newest first
  /api/studio/v1/branches:
    get:
      operationId: listBranches
      summary: Registered content branches
      responses:
        "200":
          description: Branch registry
  /api/studio/v1/approvals:
    get:
      operationId: listPendingApprovals
      summary: Pending human approvals
      responses:
        "200":
          description: Pending queue
  /api/studio/v1/approvals/{id}/decide:
    post:
      operationId: decideApproval
      summary: Approve or deny (parity with graft approve / deny)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, denied]
                decidedBy:
                  type: string
      responses:
        "200":
          description: Decision recorded
