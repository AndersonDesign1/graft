<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graft Studio</title>
    <!-- The wordmark's period on ink. Inline, so no request is made for it and
         a browser never asks the server for /favicon.ico, which isn't there. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161616'/%3E%3Ccircle cx='21.5' cy='21.5' r='4.5' fill='%23fafafa'/%3E%3C/svg%3E"
    />
    <script>
      // Stamp the stored theme before first paint — otherwise a dark-mode
      // operator gets a white flash on every load.
      try {
        var t = localStorage.getItem("graft-studio-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (_) {
        /* private mode — fall back to the OS setting */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
