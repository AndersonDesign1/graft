# Graft — split topology (P7.2): db / storage / graft as separate services.
# Run from this directory:  docker compose up --build
#
# Managed swap: drop the db and/or storage services and point the graft
# service's DATABASE_URL at Neon and S3_* at R2 — the code is pooler-aware and
# S3-generic, so the swap is environment, not code. To serve your own project,
# mount it at /project (see the commented volume).
name: graft

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: graft
      POSTGRES_PASSWORD: graft
      POSTGRES_DB: graft
    volumes:
      - graft_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graft -d graft"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: graft
      MINIO_ROOT_PASSWORD: graftsecret
    volumes:
      - graft_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  graft:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      GRAFT_MODE: serve
      DATABASE_URL: postgres://graft:graft@db:5432/graft
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: graft
      S3_SECRET_KEY: graftsecret
      S3_BUCKET: graft-assets
      # Uncomment for a stable identity / hardened runtime credential:
      # GRAFT_DEV_TOKEN: change-me
      # GRAFT_DEV_SCOPES: submissions:read
      # GRAFT_RUNTIME_PASSWORD: change-me-too
    ports:
      - "3903:3903"
    # volumes:
    #   - ../../path/to/your-project:/project

volumes:
  graft_pg:
  graft_minio:
