<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Graft: content as code, projected to Postgres">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g stroke="#1e293b" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200"/>
    <path d="M200 0V400M400 0V400M600 0V400M800 0V400M1000 0V400"/>
  </g>
  <!-- the graft: a branch joined onto a trunk -->
  <g fill="none" stroke="url(#branch)" stroke-width="10" stroke-linecap="round">
    <path d="M150 330 C 300 330, 340 210, 520 200 L 1050 200"/>
    <path d="M330 120 C 400 120, 430 196, 520 200"/>
  </g>
  <circle cx="150" cy="330" r="16" fill="#34d399"/>
  <circle cx="330" cy="120" r="16" fill="#34d399"/>
  <circle cx="1050" cy="200" r="16" fill="#38bdf8"/>
  <text x="600" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#94a3b8">MDX in git → validated → projected → rendered</text>
</svg>
