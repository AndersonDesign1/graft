name: Bug report
description: Something behaves differently from what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Follow
        [SECURITY.md](https://github.com/AndersonDesign1/graft/blob/main/SECURITY.md)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Graft did instead of what you expected.
      placeholder: |
        I ran `graft compile` on a project with two collections and it exited 0
        without writing .graft/index.db.
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: The error
      description: >-
        Paste it whole. Every Graft error carries a `code` and a `fix` field,
        and both matter for the diagnosis.
      render: text

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest project or command sequence that shows it.
      placeholder: |
        1. npx @usegraft/cli init repro
        2. cd repro
        3. graft compile
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Which index are you on?
      options:
        - Static (.graft/index.db, no database)
        - Postgres
        - Not sure
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `graft --version` and `node --version`.
      placeholder: "@usegraft/cli 0.2.0, node v22.16.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.3 / Ubuntu 24.04 / Windows 11"
