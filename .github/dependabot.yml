version: 2

# Only the github-actions ecosystem for now. Dependabot documents support for
# pnpm v7 through v10, and this workspace is on pnpm 12 (dependabot-core#14794
# tracks v11; nothing newer is documented yet). The lockfile is format 9.0,
# which pnpm 10 through 12 all emit, so npm updates may well work — enable
# that ecosystem separately and watch the first run rather than discovering
# it inside a batch of PRs.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    # One PR for every action, not one per action. Three actions across two
    # workflow files would otherwise open three PRs, and each burns the full
    # matrix: a Postgres service, the integration suite, and a Docker build.
    groups:
      actions:
        patterns: ["*"]

    # Seven days, not the three-day default. Two clocks are involved: pnpm's
    # minimumReleaseAge (4320 minutes) measures from the npm publish timestamp
    # and Dependabot measures from registry availability. A lockfile naming a
    # version younger than 4320 minutes fails `pnpm install --frozen-lockfile`
    # in CI. Seven days is above zizmor's cooldown floor and leaves slack
    # between the two windows.
    cooldown:
      default-days: 7

    commit-message:
      prefix: "chore"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    ignore:
      # Action v2 requires Changesets CLI v3. Stay on action v1 until the CLI
      # major lands; grouped bumps otherwise pull this in with zizmor-action.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

  # packages/sdk-next/compat/next14 exists to prove @usegraft/sdk-next runs on
  # Next.js 14, so its `next` must stay on 14. 14.2.35 is the last 14 release
  # and its advisories have no 14.x fix, so a security update for it can only
  # be a major bump, which would turn the Next 14 check into a second Next 15
  # check (and, on pnpm 12, arrive without its lockfile). The entry exists to
  # hold that ignore rule: version updates stay off here, as for npm
  # everywhere. The advisories are allowed by ID in security.yml and the docs
  # warn users.
  - package-ecosystem: "npm"
    directory: "/packages/sdk-next/compat/next14"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
