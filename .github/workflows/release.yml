name: Release

# Publishes @usegraft/* to npm via changesets.
#
# Publishing authenticates through GitHub Actions OIDC (trusted publishing,
# configured per package on npmjs.com), not a long-lived token — there is no
# NPM_TOKEN in this repo and no bypass-2FA credential, per npm's 2026 token
# policy changes. The npm CLI detects the OIDC environment and exchanges a
# short-lived, workflow-scoped token at publish time; `id-token: write` below
# is what makes that possible.
#
# feat/core is the working mainline (operator decision 2026-07-11); main is
# listed for the eventual post-launch branch model.
on:
  push:
    branches: [feat/core, main]
  # Retry surface. With no pending changesets, dispatching re-runs `publish`,
  # which is idempotent — changesets skips versions the registry already has.
  # A package can register only ONE trusted-publisher workflow filename, so
  # retries must come from this file rather than a separate workflow.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC — the credential trusted publishing validates

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Trusted publishing proves WHO published; provenance proves WHAT was
      # built and from where. Signs each tarball with an attestation tying it
      # to this commit, workflow and runner, which npm surfaces as the
      # "Provenance" badge. Relies on the id-token: write permission above —
      # the same OIDC identity that authenticates the publish.
      NPM_CONFIG_PROVENANCE: "true"

      # examples/landing-page constructs Better Auth at module scope, so
      # `next build` evaluates it and warns that no secret is set. Nothing
      # signed during a build is ever used, so a throwaway value keeps release
      # logs clean.
      #
      # Deliberately set HERE and not as a fallback inside the example: an
      # example that quietly substitutes its own secret would let someone
      # deploy unconfigured with a publicly-known signing key and no warning.
      # The warning is correct behaviour at runtime; it is only noise at build.
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
    steps:
      - uses: actions/checkout@v7

      # pnpm — not npm — performs the OIDC exchange. changesets picks its
      # publish tool from the lockfile and spawns `pnpm publish`; pnpm 11
      # dropped the npm CLI fallback for a native implementation carrying its
      # own trusted-publishing support. So the load-bearing version is the one
      # pinned in package.json's `packageManager` (read by action-setup), and
      # npm's version is irrelevant to authentication here.
      #
      # v6 is the release that added pnpm 11 support — the major we pin.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # setup-node v7 removed the dummy NODE_AUTH_TOKEN export, which is what
      # made registry-url hazardous here: earlier majors wrote an .npmrc holding
      # an unresolved ${NODE_AUTH_TOKEN} placeholder, and early pnpm 11 read
      # that placeholder literally and 404'd under OIDC (pnpm#11513). We set
      # registry-url and deliberately supply no token, so that was exactly our
      # shape. v7 no longer writes it, and v7 is the first major documenting
      # trusted publishing (OIDC) as a supported path.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Release tooling runs on the LTS, not the advertised floor.
          # CI (ci.yml) keeps testing the 22.16 floor.
          node-version: 24
          # Explicit, and load-bearing: setup-node v5 began auto-caching from
          # the `packageManager` field and v6 narrowed that to npm only. Naming
          # pnpm keeps the cache working regardless of those defaults.
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
