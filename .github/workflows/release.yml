name: Release

# Publishes @usegraft/* to npm via changesets.
#
# Publishing authenticates through GitHub Actions OIDC (trusted publishing,
# configured per package on npmjs.com), not a long-lived token — there is no
# NPM_TOKEN in this repo and no bypass-2FA credential, per npm's 2026 token
# policy changes. The npm CLI detects the OIDC environment and exchanges a
# short-lived, workflow-scoped token at publish time; `id-token: write` below
# is what makes that possible.
#
# main is the default branch, the one visitors and npm land on, and it is merged
# from feat/core at each release. feat/core is the working mainline and the only
# branch that publishes, so it is the only branch listed here. Adding main would
# fire a second, redundant release the moment feat/core merged into it.
on:
  push:
    branches: [feat/core]
  # Retry surface, and the canary surface. With no pending changesets and
  # `canary` unchecked, dispatching re-runs `publish`, which is idempotent —
  # changesets skips versions the registry already has.
  #
  # A package can register only ONE trusted-publisher workflow filename, so
  # both retries and canaries must come from this file. A separate canary.yml
  # would authenticate against nothing.
  workflow_dispatch:
    inputs:
      canary:
        description: "Publish a snapshot to the canary dist-tag instead of running the normal release"
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

# Least privilege at the workflow level; the publish job widens it to what it
# actually needs. `id-token: write` mints the npm trusted-publishing credential,
# so it stays out of the default set: a compromised step elsewhere in this
# workflow should not be able to reach for it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Scoped here rather than workflow-wide. changesets/action both opens the
    # version PR (contents + pull-requests) and publishes (id-token), so this
    # one job genuinely needs all three — but nothing else in the file does.
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC — the credential trusted publishing validates
    env:
      # Trusted publishing proves WHO published; provenance proves WHAT was
      # built and from where. Signs each tarball with an attestation tying it
      # to this commit, workflow and runner, which npm surfaces as the
      # "Provenance" badge. Relies on the id-token: write permission above —
      # the same OIDC identity that authenticates the publish.
      NPM_CONFIG_PROVENANCE: "true"

      # examples/landing-page constructs Better Auth at module scope, so
      # `next build` evaluates it and warns that no secret is set. Nothing
      # signed during a build is ever used, so a throwaway value keeps release
      # logs clean.
      #
      # Deliberately set HERE and not as a fallback inside the example: an
      # example that quietly substitutes its own secret would let someone
      # deploy unconfigured with a publicly-known signing key and no warning.
      # The warning is correct behaviour at runtime; it is only noise at build.
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
    steps:
      # The one checkout in this repository that keeps its credentials, and
      # the reason is `changesets/action` below: it pushes the
      # `changeset-release/<branch>` branch before opening the version pull
      # request, and that push authenticates with the token this step writes
      # into .git/config. Setting persist-credentials: false here does not
      # harden the release, it breaks it.
      #
      # What makes that acceptable rather than merely necessary: this job
      # uploads no artifacts, so there is nothing for a token in .git/config to
      # ride out on, and `contents: write` is scoped to this job alone.
      # zizmor: ignore[artipacked]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm — not npm — performs the OIDC exchange. changesets picks its
      # publish tool from the lockfile and spawns `pnpm publish`; pnpm 11
      # dropped the npm CLI fallback for a native implementation carrying its
      # own trusted-publishing support. So the load-bearing version is the one
      # pinned in package.json's `packageManager` (read by action-setup), and
      # npm's version is irrelevant to authentication here.
      #
      # v6 is the release that added pnpm 11 support — the major we pin.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # setup-node v7 removed the dummy NODE_AUTH_TOKEN export, which is what
      # made registry-url hazardous here: earlier majors wrote an .npmrc holding
      # an unresolved ${NODE_AUTH_TOKEN} placeholder, and early pnpm 11 read
      # that placeholder literally and 404'd under OIDC (pnpm#11513). We set
      # registry-url and deliberately supply no token, so that was exactly our
      # shape. v7 no longer writes it, and v7 is the first major documenting
      # trusted publishing (OIDC) as a supported path.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Release tooling runs on the LTS, not the advertised floor.
          # CI (ci.yml) keeps testing the 22.16 floor.
          node-version: 24
          # Explicit, and load-bearing: setup-node v5 began auto-caching from
          # the `packageManager` field and v6 narrowed that to npm only. Naming
          # pnpm keeps the cache working regardless of those defaults.
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Printed before anything publishes, on every run. `.changeset/pre.json`
      # is committed state, and while it exists every release off this branch is
      # a prerelease — the failure mode being "we were still in beta", found at
      # publish time. This makes the channel a thing you are told, not a thing
      # you remember.
      - name: Which channel is this
        run: pnpm release:channel

      # ── Canary: a snapshot of whatever is on this ref, right now ──────────
      #
      # A canary is a snapshot, and deliberately NOT the beta channel. The two
      # answer different questions and Graft has both:
      #
      #   canary  0.0.0-canary-<ts>  "does this commit work?"
      #   beta    1.0.0-beta.N       "is the next version ready?"
      #
      # A snapshot is version 0.0.0 forever. It sorts BELOW every real release,
      # npm never offers it as an upgrade, and there is no path from it to a
      # stable version — you hand it to someone, they pin the timestamp. That is
      # a build, not a channel. `--snapshot canary` produces it from the current
      # tree and leaves no state behind: real versions never move, `latest`
      # never moves, the next ordinary release is unaffected.
      #
      # Beta is changesets prerelease mode, which IS stateful — `.changeset/pre.json`
      # is committed, and while it exists every release off this branch is a
      # prerelease. That state used to be the argument against pre mode here,
      # because feat/core takes every ordinary push and nothing would remind you
      # to leave. It is committed state now for the same reason approvalPolicy
      # is: it appears in a diff and a review. And the "Which channel is this"
      # step above prints it before anything publishes, so being in beta is
      # something the log tells you rather than something you remember.
      #
      # The two cannot run together — changesets refuses a snapshot in pre mode
      # — so the canary step asserts the stable channel first and says why.
      #
      # `--tag canary` is load-bearing, not cosmetic. Without it changesets
      # publishes the snapshot as `latest`, which would point every plain
      # `npm i @usegraft/cli` at a 0.0.0 build. That is the one way this job
      # can do real damage, so it is the one flag to check when editing it.
      #
      # The version bump is never committed. `changeset version --snapshot`
      # rewrites package.json in the runner's checkout and that checkout is
      # thrown away, which is the point: a snapshot is a build, not a release.
      #
      # The guard between the two commands is load-bearing. With no unreleased
      # changesets, `changeset version --snapshot` only WARNS and exits 0,
      # leaving real versions in place — and `changeset publish --tag canary`
      # would then push a stable version to the canary tag, or make it a
      # package's first release under the wrong tag. The job would report
      # success either way. assert-canary-snapshot.mjs refuses that.
      - name: Publish a canary snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.canary }}
        run: |
          node scripts/release-channel.mjs --assert-stable
          pnpm version:canary
          node scripts/assert-canary-snapshot.mjs
          pnpm release:canary

      # `changeset publish` cannot be trusted to say what landed. On the first
      # canary it printed E404 for six packages, then listed all twenty-one
      # under "packages published successfully" with an empty failure list. The
      # job exited 1, so this was not silent — but the output naming which
      # packages need attention was wrong, and a partial canary is worse than
      # none, because internal deps pin the exact snapshot version and the tag
      # ends up pointing at something that fails to install.
      #
      # `always()` so it also reports after a failed publish, which is exactly
      # when the accurate list is worth having.
      - name: Verify the canary is installable
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.canary }}
        run: node scripts/assert-canary-published.mjs

      - name: Create release PR or publish
        id: changesets
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.canary }}
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action tags and releases each package separately, so one
      # version produced 21 tags and 21 GitHub Releases with one arbitrarily
      # flagged "Latest" — GitHub picks by recency. `fixed` makes these one
      # product on one version line, so this adds the release that says so: a
      # single `v<version>` with every package's changelog entry collected.
      # The per-package tags stay; npm and provenance point at them.
      - name: One release for the whole version
        if: ${{ steps.changesets.outputs.published == 'true' }}
        run: node scripts/group-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `changeset publish` in pre mode publishes to `beta` and never touches
      # `latest`, so `latest` keeps pointing at the previous release while the
      # docs describe this one. That is how 1.0.0-beta.1 shipped green with a
      # plain `npm i` still resolving beta.0 on all 21 packages.
      #
      # This step cannot fix it: OIDC trusted publishing authorises `npm
      # publish` and nothing else, and the pipeline holds no npm token on
      # purpose. So it fails the run and prints the `npm dist-tag add` lines
      # instead — the tag move stays manual, but it stops being invisible.
      - name: Does `latest` point at what we just published
        if: ${{ steps.changesets.outputs.published == 'true' }}
        run: pnpm check:dist-tags
