name: Release

# Publishes @usegraft/* to npm via changesets.
#
# Publishing authenticates through GitHub Actions OIDC (trusted publishing,
# configured per package on npmjs.com), not a long-lived token — there is no
# NPM_TOKEN in this repo and no bypass-2FA credential, per npm's 2026 token
# policy changes. The npm CLI detects the OIDC environment and exchanges a
# short-lived, workflow-scoped token at publish time; `id-token: write` below
# is what makes that possible.
#
# feat/core is the working mainline (operator decision 2026-07-11); main is
# listed for the eventual post-launch branch model.
on:
  push:
    branches: [feat/core, main]
  # Retry surface, and the canary surface. With no pending changesets and
  # `canary` unchecked, dispatching re-runs `publish`, which is idempotent —
  # changesets skips versions the registry already has.
  #
  # A package can register only ONE trusted-publisher workflow filename, so
  # both retries and canaries must come from this file. A separate canary.yml
  # would authenticate against nothing.
  workflow_dispatch:
    inputs:
      canary:
        description: "Publish a snapshot to the canary dist-tag instead of running the normal release"
        type: boolean
        default: false

concurrency: release-${{ github.ref }}

# Least privilege at the workflow level; the publish job widens it to what it
# actually needs. `id-token: write` mints the npm trusted-publishing credential,
# so it stays out of the default set: a compromised step elsewhere in this
# workflow should not be able to reach for it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Scoped here rather than workflow-wide. changesets/action both opens the
    # version PR (contents + pull-requests) and publishes (id-token), so this
    # one job genuinely needs all three — but nothing else in the file does.
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC — the credential trusted publishing validates
    env:
      # Trusted publishing proves WHO published; provenance proves WHAT was
      # built and from where. Signs each tarball with an attestation tying it
      # to this commit, workflow and runner, which npm surfaces as the
      # "Provenance" badge. Relies on the id-token: write permission above —
      # the same OIDC identity that authenticates the publish.
      NPM_CONFIG_PROVENANCE: "true"

      # examples/landing-page constructs Better Auth at module scope, so
      # `next build` evaluates it and warns that no secret is set. Nothing
      # signed during a build is ever used, so a throwaway value keeps release
      # logs clean.
      #
      # Deliberately set HERE and not as a fallback inside the example: an
      # example that quietly substitutes its own secret would let someone
      # deploy unconfigured with a publicly-known signing key and no warning.
      # The warning is correct behaviour at runtime; it is only noise at build.
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm — not npm — performs the OIDC exchange. changesets picks its
      # publish tool from the lockfile and spawns `pnpm publish`; pnpm 11
      # dropped the npm CLI fallback for a native implementation carrying its
      # own trusted-publishing support. So the load-bearing version is the one
      # pinned in package.json's `packageManager` (read by action-setup), and
      # npm's version is irrelevant to authentication here.
      #
      # v6 is the release that added pnpm 11 support — the major we pin.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # setup-node v7 removed the dummy NODE_AUTH_TOKEN export, which is what
      # made registry-url hazardous here: earlier majors wrote an .npmrc holding
      # an unresolved ${NODE_AUTH_TOKEN} placeholder, and early pnpm 11 read
      # that placeholder literally and 404'd under OIDC (pnpm#11513). We set
      # registry-url and deliberately supply no token, so that was exactly our
      # shape. v7 no longer writes it, and v7 is the first major documenting
      # trusted publishing (OIDC) as a supported path.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Release tooling runs on the LTS, not the advertised floor.
          # CI (ci.yml) keeps testing the 22.16 floor.
          node-version: 24
          # Explicit, and load-bearing: setup-node v5 began auto-caching from
          # the `packageManager` field and v6 narrowed that to npm only. Naming
          # pnpm keeps the cache working regardless of those defaults.
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # ── Canary: a snapshot of whatever is on this ref, right now ──────────
      #
      # Snapshot releases, NOT changesets prerelease mode. Prerelease mode is
      # stateful (.changeset/pre.json), it accumulates -canary.0, .1, .2 toward
      # one eventual version, and the changesets docs recommend running it from
      # a branch other than the default. feat/core IS the default branch here,
      # so entering pre mode would put every ordinary push into prerelease
      # versioning until someone remembered to exit.
      #
      # Snapshots have none of that. `--snapshot canary` produces
      # 0.0.0-canary-<timestamp> from the current tree, publishes it, and leaves
      # no state behind. Real version numbers never move, `latest` never moves,
      # and the next ordinary release is unaffected.
      #
      # `--tag canary` is load-bearing, not cosmetic. Without it changesets
      # publishes the snapshot as `latest`, which would point every plain
      # `npm i @usegraft/cli` at a 0.0.0 build. That is the one way this job
      # can do real damage, so it is the one flag to check when editing it.
      #
      # The version bump is never committed. `changeset version --snapshot`
      # rewrites package.json in the runner's checkout and that checkout is
      # thrown away, which is the point: a snapshot is a build, not a release.
      #
      # The guard between the two commands is load-bearing. With no unreleased
      # changesets, `changeset version --snapshot` only WARNS and exits 0,
      # leaving real versions in place — and `changeset publish --tag canary`
      # would then push a stable version to the canary tag, or make it a
      # package's first release under the wrong tag. The job would report
      # success either way. assert-canary-snapshot.mjs refuses that.
      - name: Publish a canary snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.canary }}
        run: |
          pnpm version:canary
          node scripts/assert-canary-snapshot.mjs
          pnpm release:canary

      - name: Create release PR or publish
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.canary }}
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
