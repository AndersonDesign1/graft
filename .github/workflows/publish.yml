name: Publish

# Re-publishes the current workspace versions. changesets/action only calls
# `publish` when pending changesets exist — which leaves no retry path when a
# version PR merged but the registry refused every upload (token permissions,
# a transient registry outage). `changeset publish` is idempotent: it checks
# the registry per package and skips versions already there, so this is a safe
# button to press at any time.

on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `pnpm release` = build + changeset publish. The build must run first:
      # each package packs its dist/, and nothing is published prebuilt.
      - name: Publish current versions
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
