name: Changeset

# A change to a published package without a changeset ships silently in
# whatever release happens next, unversioned and unmentioned in the changelog.
#
# Its own workflow, apart from the title check in pr.yml, so each runs only on
# the events that can change its answer. This one depends on the code and on
# the `no changeset` label, never on the title, so `edited` is left out. That
# includes moving the pull request to another base branch: push again, or
# re-run this check, after retargeting.
#
# Not one workflow with an `if:` per event: a job skipped by its condition
# reports success, so a title edit would replace a failed changeset check on
# the same commit with a pass.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

# Adding a label right after a push makes the earlier run moot; it is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    # A pull request that genuinely touches nothing publishable says so with
    # the label, and the reviewer sees that claim rather than a silent skip.
    #
    # The changesets version PR is excluded because it CONSUMES changesets —
    # deleting them is its entire purpose, so it can never satisfy a check that
    # demands one. This is a required status check on main, which made that
    # pull request structurally unmergeable: it failed, every time, by design,
    # and the release could not land until someone noticed why.
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no changeset')
      && github.actor != 'dependabot[bot]'
      && !startsWith(github.head_ref, 'changeset-release/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset status --since` needs the base commit to diff against.
          fetch-depth: 0
          # This job never pushes.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        env:
          # The base commit this run's merge ref was built on, already in the
          # full checkout. Diffing against the base branch's tip instead broke
          # whenever the base moved after the event: the new tip is not an
          # ancestor of HEAD, and the `--depth=1` fetch of it cut the history
          # that connects them, so changesets could not find a merge base.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if pnpm changeset status --since="$BASE_SHA"; then
            exit 0
          fi
          echo ""
          echo "No changeset found for a change that touches a published package."
          echo "Run \`pnpm changeset\`, describe the change, and commit the file."
          echo "If this pull request changes only docs, tests, or CI, add the"
          echo "\`no changeset\` label instead."
          exit 1
