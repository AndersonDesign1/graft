name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here writes to the repository, publishes, or
# needs a token beyond checkout. release.yml widens per job where it must.
permissions:
  contents: read

# A new push to a pull request makes the run for the old head worthless, so it
# is cancelled. Pushes to main always finish: each one is a commit that landed,
# and its result is the record for that commit. They get a group of their own
# (the run id), because a shared group would still let a newer push replace a
# run that is waiting to start.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `pnpm build` builds examples/landing-page, which constructs Better Auth
      # at module scope and warns when no secret is set. Build-time only — see
      # the longer note in release.yml for why this lives here rather than as a
      # fallback inside the example itself.
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
      # oxlint loads the vendored anti-slop plugin (TypeScript) through Node's
      # ESM loader. Type stripping is on by default from Node 22.18, and this
      # job pins 22.16 — the product's floor, deliberately, because node:sqlite
      # bundles FTS5 from there. The flag keeps the toolchain working without
      # raising what we advertise. A no-op on newer Node.
      NODE_OPTIONS: --experimental-strip-types
      # Turbo writes the hash of every task it runs or replays to .turbo/runs,
      # which is how scripts/prune-turbo-cache.mjs knows what to keep.
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22.16 is the floor: node:sqlite bundles FTS5 (the static index's
          # search) from 22.16.0, which is also >= pnpm 12's >=18 requirement.
          # One number everywhere; pinning keeps CI honest about what we advertise.
          node-version: 22.16
          # Explicit: setup-node v5 began auto-caching from `packageManager`
          # and v6 narrowed that to npm only. Naming pnpm pins the behaviour.
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Turbo's cache from this job's last run: this pull request's previous
      # push, or else main. A task whose inputs did not change is replayed
      # instead of run, which skips most builds and type checks on a typical
      # pull request. Each job keeps its own cache (it runs different tasks),
      # and scripts/prune-turbo-cache.mjs keeps each one the size of one run.
      - name: Restore the turbo cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-verify-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-verify-
      - run: pnpm format:check
      - run: pnpm lint
      # `graft add` copies primitives into a project, so the example's copies
      # are the ones readers see. A fix that lands in only one of the two is how
      # a patched vulnerability ships unpatched.
      - run: pnpm check:registry-drift
      # The parts of DESIGN.md a machine can catch, in the docs and Studio
      # stylesheets: mono labels, literal colors, undefined variables, stray
      # font weights, `transition: all`; and em dashes in docs prose.
      - run: pnpm check:design
      # While the repo is in beta, `latest` is an older version than the docs
      # describe. A README saying `npm i @usegraft/cli` sends a reader to a build
      # that does not match the page they read it from, which during this beta
      # means approvalPolicy in config silently doing nothing.
      - run: pnpm check:install-tag
      - run: pnpm typecheck
      - run: pnpm build
      # graft.page is a static deploy, and `astro build` exiting 0 says it
      # compiled, not that it serves. Both ways this site has broken were clean
      # builds: `/docs` became a page that could not redirect once the site went
      # static, and the on-demand routes read a SQLite artifact that Vercel does
      # not trace and would ship without. Neither is a compile error, so neither
      # is caught above. This reads the artifact Vercel actually uploads.
      #
      # Lives in `verify` rather than its own job so it reuses that build — and
      # so it is covered by a required status check that already exists.
      - run: pnpm check:site
      # The error reference on the docs site is generated from ERROR_KNOWLEDGE
      # in @usegraft/mcp, which is already under test. Prose does not fail a
      # build, so a second hand-written copy would drift invisibly. Needs the
      # build above: it imports the built package.
      - run: pnpm check:error-docs
      # The CLI reference and the README's command table are generated from
      # the command registry, the same table `graft --help` reads. Needs the
      # build above: it runs the built CLI's `graft commands --json`.
      - run: pnpm check:cli-docs
      # The changelog page is merged from every package's CHANGELOG.md, which
      # only a version PR changes. `pnpm version-packages` regenerates it, so
      # this fails only when a CHANGELOG was edited by hand without it.
      - run: pnpm check:changelog
      # No `pnpm test` here. The integration job runs every test file this
      # would, plus the ones that need Postgres: each suite skips only when
      # integration is off, never when it is on. Running both cost a minute a
      # push for the same result.
      #
      # P6.1 — cold-agent path must stay green: MCP-only introspection → write → read.
      # Explicit so the gate is visible in CI logs (also covered by the integration job).
      - name: Cold-agent self-teaching gate
        run: pnpm test:cold-agent
      # L1 — the adoption promise: an empty directory to typed reads with no
      # database and no environment. Explicit so a regression is obvious in logs.
      - name: Zero-service quickstart gate
        run: pnpm test:quickstart

      # Saved even when a step failed: turbo caches only tasks that passed,
      # and the next push can reuse those. Skipped on a re-run of the same
      # commit, whose cache is already saved.
      - name: Keep only the turbo cache entries this run used
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        run: node scripts/prune-turbo-cache.mjs
      - name: Save the turbo cache
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-verify-${{ github.sha }}

  # @usegraft/sdk-next declares Next 15 and 16 as peers, and they differ
  # where the adapter touches them: 16 added `updateTag` and made
  # `revalidateTag`'s profile required. The workspace installs one Next (16),
  # so `verify` alone proves one of the two. Each leg runs a
  # real app pinned to one major in the lockfile (packages/sdk-next/compat):
  # it type-checks the Next.js guide's code blocks against that version, builds
  # with `next build`, serves with `next start`, and checks reads, MDX,
  # dedupe, a Pages Router page and its browser bundle, tagged refresh and
  # `updateContent` in a real Server Action.
  sdk-next-compat:
    name: sdk-next on Next ${{ matrix.next }}
    runs-on: ubuntu-latest
    strategy:
      # One failing major must not hide the result of the others.
      fail-fast: false
      matrix:
        next: ["15", "16"]
    env:
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Turbo's cache from this job's last run; see the note in `verify`.
      - name: Restore the turbo cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-sdk-next-${{ matrix.next }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-sdk-next-${{ matrix.next }}-

      # The adapter, everything it imports, and the CLI that compiles the
      # app's index.
      - run: pnpm turbo run build --filter=@usegraft/sdk-next... --filter=@usegraft/cli...
      - run: pnpm --filter sdk-next-compat-next${{ matrix.next }} smoke

      # Saved even when a step failed: turbo caches only tasks that passed,
      # and the next push can reuse those. Skipped on a re-run of the same
      # commit, whose cache is already saved.
      - name: Keep only the turbo cache entries this run used
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        run: node scripts/prune-turbo-cache.mjs
      - name: Save the turbo cache
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-sdk-next-${{ matrix.next }}-${{ github.sha }}

  # The integration suite is opt-in (RUN_INTEGRATION=1 + DATABASE_URL) and was
  # therefore never running here — including the only test that proves a
  # requester cannot approve their own destructive operation. A throwaway
  # Postgres makes the human gate a CI-enforced invariant rather than a claim.
  #
  # Neon (NEON_API_KEY) and R2/S3 (S3_*) stay opt-in: those hit real external
  # services and are not appropriate on every pull request. They also need
  # RUN_LIVE=1, so RUN_INTEGRATION=1 here can never reach a paid service even
  # if a secret with one of those names is added to this job.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Hub's official image, through Google's public pull-through
        # mirror. GitHub runners share IPs, so anonymous Docker Hub pulls hit
        # its rate limit (429) and failed this job repeatedly on 2026-10-09.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/graft_test
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Turbo's cache from this job's last run; see the note in `verify`.
      - name: Restore the turbo cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-integration-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-integration-
      - run: pnpm build

      # Not `pnpm --filter @usegraft/db db:migrate`: that wrapper passes
      # --env-file=../../.env, and there is no .env in CI. Same entrypoint,
      # environment supplied by the job instead of a file.
      - name: Apply schema
        run: node packages/db/scripts/migrate.mjs

      # Per-package floors, not one repo-wide number — a single figure hides
      # that `core` is above 95% while `studio` is far lower. A ratchet: it
      # stops coverage sliding, and floors are raised when they are earned.
      # Measured with the integration suites: code that only a live database
      # can exercise (revisions, publishing, mirroring) is tested there, and a
      # unit-only figure would read it as untested.
      #
      # This is also where those packages' tests run: the script fails on a
      # failing suite as well as on a floor, so running them again without
      # coverage below would only repeat the same tests.
      - name: Tests with coverage floors
        run: pnpm coverage
        env:
          RUN_INTEGRATION: "1"

      # Every package without a floor, so each suite runs exactly once. The
      # list comes from coverage-floors.json, so a package given a floor moves
      # from this step to the one above with no edit here.
      - name: Tests for the remaining packages
        if: ${{ !cancelled() }}
        run: >-
          pnpm turbo run test --concurrency=50%
          $(node -p "Object.keys(require('./scripts/coverage-floors.json')).map((p) => '--filter=!@usegraft/' + p).join(' ')")
        env:
          RUN_INTEGRATION: "1"

      # Saved even when a step failed: turbo caches only tasks that passed,
      # and the next push can reuse those. Skipped on a re-run of the same
      # commit, whose cache is already saved.
      - name: Keep only the turbo cache entries this run used
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        run: node scripts/prune-turbo-cache.mjs
      - name: Save the turbo cache
        if: ${{ !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-integration-${{ github.sha }}

  # The container is the "one `docker run`, full backend" claim, and nothing
  # here built it. That is how `prepare` (added in 0d2fe7b) broke the image for
  # a day without a single failing check: it runs `git config`, .dockerignore
  # excludes .git, and pnpm install died with exit 128 inside the builder.
  #
  # Build only. Booting the all-in-one image needs embedded Postgres + MinIO and
  # a minute of startup, which belongs in a slower job than every push.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      # Plain `docker build`, not docker/build-push-action: every other action
      # here is SHA-pinned, and adding one more supply-chain dependency to prove
      # a Dockerfile still parses is a poor trade. The runner ships buildx.
      # Base images through mirror.gcr.io, not Docker Hub: see DOCKER_HUB in
      # the Dockerfile.
      - name: Build the self-host image
        run: docker build -f deploy/docker/Dockerfile --build-arg DOCKER_HUB=mirror.gcr.io -t graft:ci .

  # .github/rulesets/*.json is a record of branch protection, not a mechanism
  # that applies it — a change made in the GitHub UI leaves no diff anywhere.
  # The README used to carry a hand-checked date, which is a claim with a shelf
  # life. This is that claim as a job.
  #
  # Needs a token that can read repository settings, which GITHUB_TOKEN cannot
  # be: `administration` is not a permission a workflow may request for it (that
  # scope exists only for fine-grained PATs and GitHub Apps). Asking anyway does
  # not degrade gracefully — GitHub rejects the whole file and every job in it
  # stops running, which is how this was found.
  #
  # So it reads RULESETS_TOKEN: a fine-grained PAT with `administration: read`
  # on this repository and nothing else. Absent, the script skips with the
  # reason rather than passing, because rules checked without bypass actors is
  # not a verified record. That is also what a fork's pull request sees, so an
  # outside contributor is never blocked on a secret they cannot have.
  #
  # Its own job rather than a step in `verify`, so the settings-reading token is
  # never present in the runner that executes every installed dependency. The
  # script imports nothing outside node: builtins and uses global fetch, so it
  # needs no install step.
  rulesets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16

      - name: Branch protection matches the record
        run: node scripts/check-ruleset-drift.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RULESETS_TOKEN }}
