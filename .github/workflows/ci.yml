name: CI

on:
  push:
    branches: [main, feat/core]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # P6.1 — cold-agent path must stay green: MCP-only introspection → write → read.
      # Runs again explicitly so the gate is visible in CI logs (also covered by pnpm test).
      - name: Cold-agent self-teaching gate
        run: pnpm test:cold-agent
