name: CI

on:
  push:
    branches: [main, feat/core]
  pull_request:

# Read-only by default. No job here writes to the repository, publishes, or
# needs a token beyond checkout. release.yml widens per job where it must.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `pnpm build` builds examples/landing-page, which constructs Better Auth
      # at module scope and warns when no secret is set. Build-time only — see
      # the longer note in release.yml for why this lives here rather than as a
      # fallback inside the example itself.
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
      # oxlint loads the vendored anti-slop plugin (TypeScript) through Node's
      # ESM loader. Type stripping is on by default from Node 22.18, and this
      # job pins 22.16 — the product's floor, deliberately, because node:sqlite
      # bundles FTS5 from there. The flag keeps the toolchain working without
      # raising what we advertise. A no-op on newer Node.
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 22.16 is the floor: node:sqlite bundles FTS5 (the static index's
          # search) from 22.16.0, which is also >= pnpm 11's 22.13 requirement.
          # One number everywhere; pinning keeps CI honest about what we advertise.
          node-version: 22.16
          # Explicit: setup-node v5 began auto-caching from `packageManager`
          # and v6 narrowed that to npm only. Naming pnpm pins the behaviour.
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # `graft add` copies primitives into a project, so the example's copies
      # are the ones readers see. A fix that lands in only one of the two is how
      # a patched vulnerability ships unpatched.
      - run: pnpm check:registry-drift
      - run: pnpm typecheck
      - run: pnpm build
      # The error reference on the docs site is generated from ERROR_KNOWLEDGE
      # in @usegraft/mcp, which is already under test. Prose does not fail a
      # build, so a second hand-written copy would drift invisibly. Needs the
      # build above: it imports the built package.
      - run: pnpm check:error-docs
      - run: pnpm test
      # P6.1 — cold-agent path must stay green: MCP-only introspection → write → read.
      # Runs again explicitly so the gate is visible in CI logs (also covered by pnpm test).
      - name: Cold-agent self-teaching gate
        run: pnpm test:cold-agent
      # L1 — the adoption promise: an empty directory to typed reads with no
      # database and no environment. Explicit so a regression is obvious in logs.
      - name: Zero-service quickstart gate
        run: pnpm test:quickstart

  # The integration suite is opt-in (RUN_INTEGRATION=1 + DATABASE_URL) and was
  # therefore never running here — including the only test that proves a
  # requester cannot approve their own destructive operation. A throwaway
  # Postgres makes the human gate a CI-enforced invariant rather than a claim.
  #
  # Neon (NEON_API_KEY) and R2/S3 (S3_*) stay opt-in: those hit real external
  # services and are not appropriate on every pull request.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/graft_test
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.16
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Not `pnpm --filter @usegraft/db db:migrate`: that wrapper passes
      # --env-file=../../.env, and there is no .env in CI. Same entrypoint,
      # environment supplied by the job instead of a file.
      - name: Apply schema
        run: node packages/db/scripts/migrate.mjs

      - name: Integration suite
        run: pnpm test
        env:
          RUN_INTEGRATION: "1"

      # Per-package floors, not one repo-wide number — a single figure hides
      # that `core` is above 95% while `studio` is far lower. A ratchet: it
      # stops coverage sliding, and floors are raised when they are earned.
      - name: Coverage floors
        run: pnpm coverage

  # The container is the "one `docker run`, full backend" claim, and nothing
  # here built it. That is how `prepare` (added in 0d2fe7b) broke the image for
  # a day without a single failing check: it runs `git config`, .dockerignore
  # excludes .git, and pnpm install died with exit 128 inside the builder.
  #
  # Build only. Booting the all-in-one image needs embedded Postgres + MinIO and
  # a minute of startup, which belongs in a slower job than every push.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      # Plain `docker build`, not docker/build-push-action: every other action
      # here is SHA-pinned, and adding one more supply-chain dependency to prove
      # a Dockerfile still parses is a poor trade. The runner ships buildx.
      - name: Build the self-host image
        run: docker build -f deploy/docker/Dockerfile -t graft:ci .

  # .github/rulesets/*.json is a record of branch protection, not a mechanism
  # that applies it — a change made in the GitHub UI leaves no diff anywhere.
  # The README used to carry a hand-checked date, which is a claim with a shelf
  # life. This is that claim as a job.
  #
  # Needs a token that can read repository settings, which GITHUB_TOKEN cannot
  # be: `administration` is not a permission a workflow may request for it (that
  # scope exists only for fine-grained PATs and GitHub Apps). Asking anyway does
  # not degrade gracefully — GitHub rejects the whole file and every job in it
  # stops running, which is how this was found.
  #
  # So it reads RULESETS_TOKEN: a fine-grained PAT with `administration: read`
  # on this repository and nothing else. Absent, the script skips with the
  # reason rather than passing, because rules checked without bypass actors is
  # not a verified record. That is also what a fork's pull request sees, so an
  # outside contributor is never blocked on a secret they cannot have.
  #
  # Its own job rather than a step in `verify`, so the settings-reading token is
  # never present in the runner that executes every installed dependency. The
  # script imports nothing outside node: builtins and uses global fetch, so it
  # needs no install step.
  rulesets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this job pushes, and a persisted token in .git/config
          # is one careless artifact upload away from being published.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.16

      - name: Branch protection matches the record
        run: node scripts/check-ruleset-drift.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.RULESETS_TOKEN }}
