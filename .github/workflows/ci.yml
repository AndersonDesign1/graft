name: CI

on:
  push:
    branches: [main, feat/core]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22.13 is the floor: node:sqlite (static index) is stable since
          # 22.12, and pnpm 11 requires >= 22.13. One number everywhere.
          # Pinning the minor keeps CI honest about the version we advertise.
          node-version: 22.13
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # P6.1 — cold-agent path must stay green: MCP-only introspection → write → read.
      # Runs again explicitly so the gate is visible in CI logs (also covered by pnpm test).
      - name: Cold-agent self-teaching gate
        run: pnpm test:cold-agent
      # L1 — the adoption promise: an empty directory to typed reads with no
      # database and no environment. Explicit so a regression is obvious in logs.
      - name: Zero-service quickstart gate
        run: pnpm test:quickstart
