name: CI

on:
  push:
    branches: [main, feat/core]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `pnpm build` builds examples/landing-page, which constructs Better Auth
      # at module scope and warns when no secret is set. Build-time only — see
      # the longer note in release.yml for why this lives here rather than as a
      # fallback inside the example itself.
      BETTER_AUTH_SECRET: build-only-value-never-used-at-runtime
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22.16 is the floor: node:sqlite bundles FTS5 (the static index's
          # search) from 22.16.0, which is also >= pnpm 11's 22.13 requirement.
          # One number everywhere; pinning keeps CI honest about what we advertise.
          node-version: 22.16
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # P6.1 — cold-agent path must stay green: MCP-only introspection → write → read.
      # Runs again explicitly so the gate is visible in CI logs (also covered by pnpm test).
      - name: Cold-agent self-teaching gate
        run: pnpm test:cold-agent
      # L1 — the adoption promise: an empty directory to typed reads with no
      # database and no environment. Explicit so a regression is obvious in logs.
      - name: Zero-service quickstart gate
        run: pnpm test:quickstart
