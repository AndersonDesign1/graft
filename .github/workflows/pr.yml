name: PR

# Squash-merge takes the pull request *title* as the commit message, so the
# title is what actually has to satisfy Conventional Commits. ci.yml cannot
# check that: it never sees the title.
#
# The changeset check lives in changeset.yml. It reacts to labels and this
# reacts to title edits; in one workflow, each re-ran on the other's events.

on:
  pull_request:
    # `synchronize` because a required check is recorded per commit: a new head
    # needs its own result even when the title did not change.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# Only the newest event for a pull request matters; an older run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            build
            ci
            revert
          # Package directory names, so `fix(mdx-safety): …` reads the same way
          # the workspace is laid out. `deps` covers Dependabot's grouped PRs.
          scopes: |
            assets
            auth
            cli
            compiler
            content-api
            content-migrations
            contracts
            core
            db
            mcp
            mdx-safety
            registry
            sdk-astro
            sdk-core
            sdk-next
            sdk-react
            sdk-react-router
            sdk-sveltekit
            sdk-tanstack-start
            studio
            tokens
            docs-site
            landing-page
            deploy
            release
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" must start lowercase, and must not end with
            a period.
